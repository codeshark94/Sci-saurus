name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install local JSON validation capability
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "$(sed -n '/^jsonschema==/p' requirements-runtime.txt)"
      - name: Run acceptance test suite
        run: python -m unittest discover -s scisaurus/tests -t . -v
