name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned runtime and source extractor
        run: sh scripts/setup-runtime.sh
      - name: Run acceptance test suite
        run: .venv/bin/python -m unittest discover -s scisaurus/tests -t . -v
