<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">Sci-saurus mission flow and recovery</title>
  <desc id="description">Composer ranks dependency-ready work and checks admission constraints. A default paper mission proceeds through Topic, Survey, Experiment, Interpretation, Argument, and Paper. Findings can create a scoped repair order and return the work to Composer for replanning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#56616b"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7b858e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222b33; }
      .title { font-size: 16px; font-weight: 650; }
      .copy { font-size: 12px; fill: #48535d; }
      .small { font-size: 11px; fill: #606a73; }
      .label { font-size: 11px; fill: #59636d; }
      .node { fill: #ffffff; stroke: #65717b; stroke-width: 1.35; }
      .stage { fill: #ffffff; stroke: #909ba4; stroke-width: 1.15; }
    </style>
  </defs>

  <rect width="1280" height="560" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 136H420M670 136H820" stroke="#56616b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M225 297H255M425 297H455M625 297H655M825 297H855M1025 297H1055" stroke="#56616b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M140 349V380M340 349V380M540 349V380M740 349V380M940 349V380M1140 349V380" stroke="#7b858e" stroke-width="1.35" stroke-dasharray="4 5"/>
    <path d="M140 380H1140M640 380V420" stroke="#7b858e" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow-muted)"/>
    <path d="M810 459H850" stroke="#7b858e" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow-muted)"/>
    <path d="M1120 459H1245V202H545V177" stroke="#7b858e" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow-muted)"/>
  </g>

  <rect class="node" x="80" y="95" width="220" height="82" rx="3"/>
  <text class="title" x="98" y="124">Composer</text>
  <text class="copy" x="98" y="149">Plans work and records decisions</text>

  <rect class="node" x="420" y="95" width="250" height="82" rx="3"/>
  <text class="title" x="438" y="124">Adaptive agenda</text>
  <text class="copy" x="438" y="149">Ranks the ready frontier</text>

  <rect class="node" x="820" y="95" width="360" height="82" rx="3"/>
  <text class="title" x="838" y="124">Safe admission</text>
  <text class="copy" x="838" y="149">Checks dependencies, quota, and deadline</text>

  <text class="label" x="55" y="230">Default paper mission</text>

  <rect class="stage" x="55" y="245" width="170" height="104" rx="2"/>
  <text class="title" x="73" y="280">Topic</text>
  <text class="copy" x="73" y="307">Free-topic only</text>

  <rect class="stage" x="255" y="245" width="170" height="104" rx="2"/>
  <text class="title" x="273" y="280">Survey</text>
  <text class="copy" x="273" y="307">Search · acquire · verify</text>

  <rect class="stage" x="455" y="245" width="170" height="104" rx="2"/>
  <text class="title" x="473" y="280">Experiment</text>
  <text class="copy" x="473" y="307">Freeze · run · replay</text>

  <rect class="stage" x="655" y="245" width="170" height="104" rx="2"/>
  <text class="title" x="673" y="280">Interpretation</text>
  <text class="copy" x="673" y="307">Explain · compare</text>

  <rect class="stage" x="855" y="245" width="170" height="104" rx="2"/>
  <text class="title" x="873" y="280">Argument</text>
  <text class="copy" x="873" y="307">Claims · evidence</text>

  <rect class="stage" x="1055" y="245" width="170" height="104" rx="2"/>
  <text class="title" x="1073" y="280">Paper</text>
  <text class="copy" x="1073" y="307">Write · review · propose</text>

  <text class="label" x="55" y="402">Findings from any stage</text>

  <rect class="node" x="470" y="420" width="340" height="78" rx="3"/>
  <text class="title" x="488" y="449">Scoped repair order</text>
  <text class="copy" x="488" y="475">Gap · control · test · claim finding</text>

  <rect class="node" x="850" y="420" width="270" height="78" rx="3"/>
  <text class="title" x="868" y="449">Replan</text>
  <text class="copy" x="868" y="475">Re-score the ready frontier</text>

  <path d="M60 530H100" stroke="#56616b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="small" x="112" y="534">Control routing or accepted dependency</text>
  <path d="M400 530H440" stroke="#7b858e" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow-muted)"/>
  <text class="small" x="452" y="534">Evidence finding · repair · replan</text>
</svg>
